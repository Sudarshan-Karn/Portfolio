<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Animated cartoon avatar of Sudarshan Karn">
  <title>Sudarshan Karn — animated avatar</title>
  <defs>
    <clipPath id="circ"><circle cx="200" cy="200" r="198"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ff9a55"/>
      <stop offset="0.55" stop-color="#f56b1e"/>
      <stop offset="1" stop-color="#a8400a"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d49a72"/>
      <stop offset="1" stop-color="#c0805a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2ee"/>
      <stop offset="1" stop-color="#d9d6d0"/>
    </linearGradient>
  </defs>

  <style>
    .bob      { animation: bob 3.6s ease-in-out infinite; }
    .blink    { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    .brows    { animation: brows 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle  { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle.s2 { animation-delay: .9s; }
    .sparkle.s3 { animation-delay: 1.7s; }
    .body     { animation: breathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes bob     { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(-1.2deg); } }
    @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }
    @keyframes blink   { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    @keyframes brows   { 0%,80%,100% { transform: translateY(0); } 88% { transform: translateY(-3px); } }
    @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: .9; transform: scale(1); } }
  </style>

  <g clip-path="url(#circ)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <!-- soft background rings -->
    <circle cx="200" cy="215" r="150" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="200" cy="215" r="185" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>

    <!-- floating sparkles -->
    <g fill="#fff">
      <path class="sparkle"    d="M62 110 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
      <path class="sparkle s2" d="M338 92 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path class="sparkle s3" d="M345 215 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    </g>

    <!-- ═════ BODY / HOODIE ═════ -->
    <g class="body">
      <!-- hood resting behind neck -->
      <path d="M118 318 C110 282 140 262 200 262 C260 262 290 282 282 318 Z" fill="#cfccc6"/>
      <!-- shoulders -->
      <path d="M26 400 C32 338 84 308 150 296 L250 296 C316 308 368 338 374 400 Z" fill="url(#hood)"/>
      <!-- hood cowl around neck -->
      <path d="M128 300 C120 276 150 268 168 282 C182 296 218 296 232 282 C250 268 280 276 272 300 C262 322 232 332 200 332 C168 332 138 322 128 300 Z" fill="#e8e5df" stroke="#c9c5be" stroke-width="2"/>
      <!-- neck -->
      <path d="M166 250 L166 292 C178 312 222 312 234 292 L234 250 Z" fill="#b57652"/>
      <path d="M166 262 C180 282 220 282 234 262 L234 250 L166 250 Z" fill="#9c6342" opacity=".55"/>
      <!-- placket + buttons -->
      <path d="M200 322 L200 400" stroke="#c9c5be" stroke-width="2.5"/>
      <circle cx="200" cy="352" r="5.5" fill="#f4f2ee" stroke="#bdb9b1" stroke-width="2"/>
      <circle cx="200" cy="384" r="5.5" fill="#f4f2ee" stroke="#bdb9b1" stroke-width="2"/>
      <!-- fabric folds -->
      <path d="M92 360 C112 344 126 340 140 344" stroke="#cdc9c2" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M308 360 C288 344 274 340 260 344" stroke="#cdc9c2" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- chest embroidery nod -->
      <path d="M238 366 q8 -8 14 0 t14 0 t14 0" stroke="#e5543b" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- ═════ HEAD ═════ -->
    <g class="bob" style="transform-origin: 200px 290px;">
      <!-- ears -->
      <ellipse cx="121" cy="184" rx="11" ry="19" fill="#c0805a"/>
      <ellipse cx="279" cy="184" rx="11" ry="19" fill="#c0805a"/>
      <path d="M120 176 q-4 8 0 16" stroke="#9c6342" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M280 176 q4 8 0 16" stroke="#9c6342" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- face -->
      <path d="M122 168 C122 108 160 86 200 86 C240 86 278 108 278 168 C278 218 252 272 200 280 C148 272 122 218 122 168 Z" fill="url(#skin)"/>
      <!-- cheek warmth -->
      <ellipse cx="158" cy="214" rx="20" ry="12" fill="#e08a6a" opacity=".28"/>
      <ellipse cx="242" cy="214" rx="20" ry="12" fill="#e08a6a" opacity=".28"/>
      <!-- jaw stubble -->
      <path d="M128 196 C134 242 160 276 200 282 C240 276 266 242 272 196 C262 236 240 262 200 266 C160 262 138 236 128 196 Z" fill="#1d1612" opacity=".28"/>

      <!-- hair (back volume + quiff) -->
      <path d="M116 176 C102 108 134 52 196 46 C262 44 300 100 284 176 C280 150 272 128 258 114 C240 122 196 120 168 106 C150 122 136 146 130 176 Z" fill="url(#hair)"/>
      <path d="M136 92 C150 52 226 38 270 82 C246 62 190 58 150 98 Z" fill="#3a3a42" opacity=".7"/>
      <!-- quiff highlight -->
      <path d="M170 64 C196 50 232 54 252 74" stroke="#55555f" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
      <!-- sideburns -->
      <path d="M118 172 C120 176 126 176 130 172 L132 198 C124 192 120 184 118 172 Z" fill="#171719"/>
      <path d="M282 172 C280 176 274 176 270 172 L268 198 C276 192 280 184 282 172 Z" fill="#171719"/>

      <!-- eyebrows -->
      <g class="brows" fill="#141416">
        <path d="M144 150 C156 138 178 138 190 146 C178 146 160 148 148 156 Z"/>
        <path d="M256 150 C244 138 222 138 210 146 C222 146 240 148 252 156 Z"/>
      </g>

      <!-- eyes -->
      <g class="blink">
        <ellipse cx="168" cy="170" rx="15" ry="8.5" fill="#fbf7f2"/>
        <ellipse cx="232" cy="170" rx="15" ry="8.5" fill="#fbf7f2"/>
        <circle cx="170" cy="170" r="7.2" fill="#2a1710"/>
        <circle cx="230" cy="170" r="7.2" fill="#2a1710"/>
        <circle cx="170" cy="170" r="3.4" fill="#000"/>
        <circle cx="230" cy="170" r="3.4" fill="#000"/>
        <circle cx="172.6" cy="167.4" r="2" fill="#fff"/>
        <circle cx="232.6" cy="167.4" r="2" fill="#fff"/>
        <!-- lids / lashes line -->
        <path d="M152 168 C160 159 178 159 184 168" stroke="#141416" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M248 168 C240 159 222 159 216 168" stroke="#141416" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <!-- under-eye -->
      <path d="M156 182 C164 187 174 187 181 182" stroke="#9c6342" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
      <path d="M244 182 C236 187 226 187 219 182" stroke="#9c6342" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>

      <!-- nose -->
      <path d="M200 172 C196 190 192 200 190 206 C196 212 204 212 210 206 C208 200 204 190 200 172 Z" fill="#a96c48" opacity=".45"/>
      <ellipse cx="193" cy="208" rx="3.2" ry="2" fill="#4a2a1a"/>
      <ellipse cx="207" cy="208" rx="3.2" ry="2" fill="#4a2a1a"/>

      <!-- mouth -->
      <path d="M182 236 C192 244 208 244 218 236 C208 238 192 238 182 236 Z" fill="#d97b6c"/>
      <path d="M184 235 C194 241 206 241 216 235" stroke="#8c3b32" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M190 240 C196 243 204 243 210 240 C204 245 196 245 190 240 Z" fill="#fff" opacity=".9"/>

      <!-- moustache -->
      <path d="M200 220 C190 214 168 214 154 226 C166 224 178 226 188 232 C194 234 198 232 200 230 C202 232 206 234 212 232 C222 226 234 224 246 226 C232 214 210 214 200 220 Z" fill="#141416"/>
      <!-- goatee / chin beard -->
      <path d="M178 252 C184 247 216 247 222 252 C228 266 216 282 200 288 C184 282 172 266 178 252 Z" fill="#141416"/>
      <path d="M190 244 C196 248 204 248 210 244 L210 252 C204 254 196 254 190 252 Z" fill="#141416"/>
    </g>
  </g>
  <circle cx="200" cy="200" r="198" fill="none" stroke="#f56b1e" stroke-opacity=".5" stroke-width="2"/>
</svg>
